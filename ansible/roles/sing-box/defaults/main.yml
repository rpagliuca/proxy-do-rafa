---
# Versao e hash fixados: o binario que roda no servidor tem que ser o mesmo que
# o `sing-box check` validou aqui. Sem o hash, "1.13.19" e uma promessa do
# servidor de downloads, nao um fato.
singbox_versao: "1.13.19"
singbox_sha256_arm64: "7fe3597a95a3c5ad67477b1d7653b9ce097e0be7c676758eba1fcf558f353d57"

singbox_usuario: sing-box
singbox_diretorio: /etc/sing-box

# Site cuja identidade TLS o REALITY veste.
#
# ⚠️ NAO TROQUE SEM RODAR `make testar-tunel`.
#
# Suportar TLS 1.3 e HTTP/2 NAO BASTA. Medido em 2026-08-18, com o mesmo
# binario dos dois lados:
#
#   www.microsoft.com   -> REALITY: processed invalid connection   (NAO funciona)
#   www.apple.com       -> OK
#   dl.google.com       -> OK
#   addons.mozilla.org  -> OK
#   www.cloudflare.com  -> OK
#
# E os dois primeiros negociam TLS 1.3 com X25519 e anunciam h2 — conferido. O
# que separa um do outro esta em como a borda daquele host responde ao handshake
# que o servidor relaya, e nao da para deduzir da capacidade anunciada. So
# medindo.
#
# Por que isso passou despercebido: com o decoy errado, a autenticacao falha e o
# servidor faz exatamente o que deveria fazer com uma sonda — repassa para o site
# real. O controle `disfarce-01` PASSA, porque o disfarce esta perfeito. O que
# nao funciona e o tunel. Por isso existe `make testar-tunel`.
#
# O outro criterio, alem de funcionar: ser um destino que a rede fechada JA
# permite. Um decoy bloqueado transforma o disfarce em alvo. www.apple.com passa
# em praticamente toda rede corporativa.
singbox_decoy: "www.apple.com"

# Tag do no na tailnet. E a tag, e nao o nome, que as ACLs devem referenciar:
# a maquina e efemera e o nome ganha sufixo (proxy-do-rafa-1, -2) enquanto o no
# anterior nao foi coletado. A tag e estavel por desenho.
#
# Precisa existir em `tagOwners` na policy do tailnet — ver docs/tailscale.md.
tailscale_tag: "tag:proxy-do-rafa"
