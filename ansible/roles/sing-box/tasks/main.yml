---
- name: Usuario de servico do sing-box
  ansible.builtin.user:
    name: "{{ singbox_usuario }}"
    system: true
    shell: /sbin/nologin
    home: /var/lib/sing-box
    create_home: true

- name: Baixar o sing-box
  ansible.builtin.get_url:
    url: "https://github.com/SagerNet/sing-box/releases/download/v{{ singbox_versao }}/sing-box-{{ singbox_versao }}-linux-arm64.tar.gz"
    dest: "/tmp/sing-box-{{ singbox_versao }}.tar.gz"
    checksum: "sha256:{{ singbox_sha256_arm64 }}"
    mode: "0644"

# ⚠️ ignore_errors em --check, e so em --check: o `get_url` acima nao baixa nada
# em modo simulacao, entao esta task acha que o arquivo "nao existe" e falha.
# Sem isto, `make check` sempre termina em erro — e um dry-run que sempre falha
# ensina a ignorar o dry-run.
- name: Extrair o sing-box
  ansible.builtin.unarchive:
    src: "/tmp/sing-box-{{ singbox_versao }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/sing-box-{{ singbox_versao }}-linux-arm64/sing-box"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Instalar o binario
  ansible.builtin.copy:
    src: "/tmp/sing-box-{{ singbox_versao }}-linux-arm64/sing-box"
    dest: /usr/local/bin/sing-box
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  ignore_errors: "{{ ansible_check_mode }}"
  notify: Reiniciar sing-box

- name: Diretorios de configuracao
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ singbox_usuario }}"
    mode: "0750"
  loop:
    - "{{ singbox_diretorio }}"
    - "{{ singbox_diretorio }}/tls"

# O certificado e autoassinado e vem do SOPS, gerado UMA vez e reutilizado.
#
# Gerar um novo a cada `make up` funcionaria, mas obrigaria a regerar tambem a
# configuracao de todo cliente — e o Hysteria2 fixa o certificado no cliente,
# justamente por nao haver CA. Fixo no SOPS, so o IP muda entre viagens.
- name: Certificado TLS da origem
  ansible.builtin.copy:
    content: "{{ tls_cert_pem_b64 | b64decode }}"
    dest: "{{ singbox_diretorio }}/tls/cert.pem"
    owner: root
    group: "{{ singbox_usuario }}"
    mode: "0640"
  notify: Reiniciar sing-box

- name: Chave privada TLS da origem
  ansible.builtin.copy:
    content: "{{ tls_key_pem_b64 | b64decode }}"
    dest: "{{ singbox_diretorio }}/tls/key.pem"
    owner: root
    group: "{{ singbox_usuario }}"
    mode: "0640"
  no_log: true
  notify: Reiniciar sing-box

# ⚠️ A auth key e cunhada nova a cada `make up`. Se ela entrasse direto no
# template, o arquivo mudaria em TODA execucao, o handler dispararia, e o
# sing-box reiniciaria — derrubando quem estivesse usando o tunel naquele
# momento. Numa ferramenta de viagem, isso significa "reaplicar a configuracao
# te desconecta", e tambem torna a idempotencia impossivel de verificar:
# `changed=2` para sempre, escondendo qualquer mudanca real no meio do ruido.
#
# A key so importa na PRIMEIRA autenticacao: depois disso o tsnet guarda o
# estado do no em /var/lib/sing-box e nunca mais olha para ela. Entao, se ja
# existe configuracao nesta maquina, reaproveita-se a que esta la — mesmo
# expirada, porque ela nao sera usada de novo.
- name: Existe configuracao anterior nesta maquina?
  ansible.builtin.stat:
    path: "{{ singbox_diretorio }}/config.json"
  register: config_anterior

- name: Ler a configuracao que ja esta em uso
  ansible.builtin.slurp:
    src: "{{ singbox_diretorio }}/config.json"
  register: config_em_uso
  when: config_anterior.stat.exists
  no_log: true

- name: Reaproveitar a auth key ja autenticada
  ansible.builtin.set_fact:
    tailscale_authkey_efetiva: "{{ (config_em_uso.content | b64decode | from_json).endpoints[0].auth_key }}"
  when: config_anterior.stat.exists
  no_log: true

- name: Usar a auth key recem-cunhada na primeira configuracao
  ansible.builtin.set_fact:
    tailscale_authkey_efetiva: "{{ tailscale_authkey }}"
  when: not config_anterior.stat.exists
  no_log: true

# `validate` roda `sing-box check` no arquivo NOVO antes de ele substituir o que
# esta em uso. Sem isso, uma virgula errada no template derruba o servico e a
# unica pista fica no journal de uma maquina que talvez ja nao seja alcancavel
# — porque o caminho de acesso passa por ela.
- name: Configuracao do sing-box
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ singbox_diretorio }}/config.json"
    owner: root
    group: "{{ singbox_usuario }}"
    mode: "0640"
    validate: "/usr/local/bin/sing-box check -c %s"
  no_log: true
  ignore_errors: "{{ ansible_check_mode }}"
  notify: Reiniciar sing-box

- name: Unit do systemd
  ansible.builtin.copy:
    dest: /etc/systemd/system/sing-box.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=sing-box: saida privada efemera
      After=network-online.target
      Wants=network-online.target

      [Service]
      User={{ singbox_usuario }}
      # O processo escuta na 443 sem ser root: a capacidade e concedida sozinha,
      # em vez de dar root ao processo inteiro so por causa de uma porta baixa.
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      CapabilityBoundingSet=CAP_NET_BIND_SERVICE
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      StateDirectory=sing-box
      ExecStart=/usr/local/bin/sing-box run -c {{ singbox_diretorio }}/config.json -D /var/lib/sing-box
      Restart=always
      RestartSec=5
      LimitNOFILE=infinity

      [Install]
      WantedBy=multi-user.target
  notify:
    - Recarregar systemd
    - Reiniciar sing-box

- name: Habilitar e iniciar o sing-box
  ansible.builtin.systemd_service:
    name: sing-box
    enabled: true
    state: started
    daemon_reload: true

# ⚠️ Forca os handlers AQUI, antes da role `demux`.
#
# Handler so roda no fim do play. Sem este flush, a sequencia seria: sing-box
# reconfigurado mas AINDA rodando com a config velha (segurando a 443) -> nginx
# tenta subir na 443 -> "Address already in use". A falha apareceria na role
# errada, e depois de um `make config` a maquina ficaria sem nada atendendo.
- name: Aplicar a nova configuracao antes de o nginx disputar a 443
  ansible.builtin.meta: flush_handlers
