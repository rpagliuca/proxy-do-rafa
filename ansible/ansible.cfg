[defaults]
inventory            = ../.local/inventario.yml
host_key_checking    = False
# A maquina e recriada a cada `make up`, com IP novo e chave de host nova.
# Guardar known_hosts aqui so produziria um aviso de "chave mudou" toda vez —
# aviso que, repetido, ensina a ignorar avisos.
# `yaml` NAO existe no ansible-core: ele vive em community.general, e este
# repositorio nao usa collection nenhuma de proposito. Com stdout_callback=yaml
# o ansible falha com "Could not load 'yaml' callback plugin" e nao roda nada.
stdout_callback      = default
interpreter_python   = /usr/bin/python3
retry_files_enabled  = False

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15
