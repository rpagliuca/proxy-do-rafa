[defaults]
inventory            = ../.local/inventario.yml
host_key_checking    = False
# A maquina e recriada a cada `make up`, com IP novo e chave de host nova.
# Guardar known_hosts aqui so produziria um aviso de "chave mudou" toda vez —
# aviso que, repetido, ensina a ignorar avisos.
stdout_callback      = yaml
interpreter_python   = /usr/bin/python3
retry_files_enabled  = False

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15
