---
- name: Saida privada efemera
  hosts: proxy
  become: true
  remote_user: ec2-user
  gather_facts: true

  pre_tasks:
    - name: Esperar a maquina aceitar SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    # Sem isto, a primeira execucao depois de `make up` corre o risco de
    # disputar o dnf com o cloud-init e falhar com "lock ja em uso" — falha que
    # se le como problema de rede e manda investigar o lugar errado.
    - name: Esperar o cloud-init terminar
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

  roles:
    - base
    - sing-box
    - demux

  post_tasks:
    - name: Conferir quem atende a 443
      ansible.builtin.command: ss -lntp
      register: escuta
      changed_when: false

    - name: A 443 tem que ser do nginx, e o sing-box tem que estar so em loopback
      ansible.builtin.assert:
        that:
          - "'0.0.0.0:443' in escuta.stdout"
          - "'127.0.0.1:8444' in escuta.stdout"
          - "'127.0.0.1:8443' in escuta.stdout"
        fail_msg: |
          A 443 nao esta com o nginx, ou o sing-box nao subiu nas portas internas.
          Isso deixa o servico inteiro fora do ar sem nenhuma task ter falhado.
          Saida de `ss -lntp`:
          {{ escuta.stdout }}
